# Local + small-host docker compose for the broadcast dashboard.
# Use this on a laptop, EC2 box, or DigitalOcean droplet to run the
# image identically to AWS App Runner / ECS.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#
# To rebuild after a code change:
#   docker compose up -d --build

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.aws
    image: tn-election-results:latest
    container_name: tn-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_PATH: /data/tn.db
      # Required — both must be set in production. Generate fresh values:
      #   openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      AUTH_NAADHAS_PASSWORD: ${AUTH_NAADHAS_PASSWORD:?Set in .env}
      AUTH_AADHAN_PASSWORD: ${AUTH_AADHAN_PASSWORD:?Set in .env}
      # Optional scraper config — only set on the box that runs the
      # ECI scraper, not on the broadcast hosts.
      # SCRAPE_URL_TEMPLATE: ""
      # POLL_INTERVAL_MS: "30000"
    volumes:
      - tn_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/results').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tn_data:
    driver: local
